# Local run:  docker compose up --build   then open http://localhost:8080
services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: wastewise_db
      DB_USER: wastewise
      DB_PASS: change-this-password
      APP_ENV: development
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: change-this-root-password
      MYSQL_DATABASE: wastewise_db
      MYSQL_USER: wastewise
      MYSQL_PASSWORD: change-this-password
    volumes:
      - db_data:/var/lib/mysql
      # The schema runs automatically the first time the database starts
      - ./wastewise_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  db_data:
